[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flexihaz"
version = "0.1.0"
description = "Partially linear and fully nonparametric neural hazard models for survival analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Matan Bar Tov" },
    { name = "Asaf Ben Arie" },
    { name = "Malka Gorfine" }
]
keywords = [
    "survival-analysis",
    "neural-survival-analysis",
    "hazard-model",
    "deep-learning",
    "semiparametric-models",
    "time-to-event"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "torch>=2.0",
    "pandas>=1.5",
    "lifelines>=0.27",
    "optuna>=3.0"
]

[project.optional-dependencies]
test = [
    "pytest>=7.0"
]
experiments = [
    "scikit-survival>=0.22",
    "tensorflow>=2.12",
    "matplotlib>=3.7",
    "jupyter>=1.0"
]
dev = [
    "pytest>=7.0",
    "build>=1.0"
]

[project.urls]
Repository = "https://github.com/MatanBarTov/FLEXI-Haz"
Documentation = "https://github.com/MatanBarTov/FLEXI-Haz#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
